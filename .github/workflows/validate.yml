name: Validate template
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check_repo.py
      - run: python -m unittest discover -s tests -v
  pilot-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/pilot_usage/requirements.txt
      - name: Verify PDF delivery
        run: |
          export PILOT_PDF_RENDERER="$(command -v google-chrome)"
          test -n "$PILOT_PDF_RENDERER"
          python -m unittest discover -s tests -p test_pilot_delivery.py -v
